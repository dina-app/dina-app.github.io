# Secret scanning stays on for this repository. One path is excluded, and only
# because the credential there cannot be anything but public.
#
# apps/sheetconnect-for-salesforce/picker.html carries a Google browser API key.
# The Google Picker reads its developer key out of the page, so there is no
# configuration in which that key is private, and rotating it would produce an
# equally public one. Moving it out of the repository and injecting it at deploy
# time would not help either: GitHub Pages serves this repository directly, so the
# key would still be readable at https://dina.jp — it would only be harder for a
# maintainer to find.
#
# What limits it is not secrecy:
#   - restricted in Google Cloud Console to the Google Picker API alone
#   - restricted to an HTTP referrer of https://dina.jp/*
#   - it authorises no data access on its own. Reading or writing any file also
#     requires that user's own OAuth token, and the drive.file scope confines that
#     to the files the user picks in Google's own dialog.
#   - the Picker API's only quota is per end user, so there is no shared project
#     pool that misuse could exhaust.
#
# Referrer restrictions can be forged. They are hygiene here, not the boundary;
# the boundary is that the key alone authorises nothing.
#
# This exclusion is deliberately one file. Do not widen it to a directory: every
# other secret in this repository should still be caught.
paths-ignore:
  - "apps/sheetconnect-for-salesforce/picker.html"
