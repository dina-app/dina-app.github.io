<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DinaLab">
  <defs>
    <linearGradient id="neon" x1="10" y1="58" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdff"/>
      <stop offset="0.5" stop-color="#0a63ff"/>
      <stop offset="1" stop-color="#5ec8ff"/>
    </linearGradient>
    <!-- Bloom is drawn as a blurred copy underneath, so the crisp core stays
         readable down to the 36px header mark. -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open bracket: the gap at the top right is what makes the frame read as
         a mark rather than a plain rounded square. -->
    <path id="frame" d="M36 12H19A13 13 0 0 0 6 25v20a13 13 0 0 0 13 13h18a13 13 0 0 0 13-13V32"/>
    <path id="bowl" d="M20 23v24h7a12 12 0 0 0 0-24Z"/>

    <use href="#frame" stroke="url(#neon)" stroke-width="7" opacity="0.85" filter="url(#bloom)"/>
    <use href="#bowl" stroke="url(#neon)" stroke-width="7" opacity="0.85" filter="url(#bloom)"/>

    <use href="#frame" stroke="url(#neon)" stroke-width="4.2"/>
    <use href="#bowl" stroke="url(#neon)" stroke-width="4.2"/>

    <use href="#frame" stroke="#eaf7ff" stroke-width="1.3" opacity="0.9"/>
    <use href="#bowl" stroke="#eaf7ff" stroke-width="1.3" opacity="0.9"/>
  </g>

  <defs>
    <path id="sparkA" d="M48 6.5Q48 12 53.5 12Q48 12 48 17.5Q48 12 42.5 12Q48 12 48 6.5Z"/>
    <path id="sparkB" d="M56 13.5Q56 20 62.5 20Q56 20 56 26.5Q56 20 49.5 20Q56 20 56 13.5Z"/>
  </defs>

  <g fill="#bfe8ff">
    <use href="#sparkA" fill="#4fc3ff" filter="url(#bloom)"/>
    <use href="#sparkB" fill="#4fc3ff" filter="url(#bloom)"/>
    <use href="#sparkA"/>
    <use href="#sparkB"/>
  </g>
</svg>
