<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support | DinaLab</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://dina.jp/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Support is a panel on every page now, not a page. Links to /support/ (and
    // /support/?app=<slug> from the extensions) land on that app's own page, or
    // the home page, with the panel already open.
    (function () {
      var app = new URLSearchParams(location.search).get("app") || "";
      var pages = ["sheetconnect-for-salesforce", "dinasheet-for-salesforce", "salesforce-admin-toolkit", "salesforce-agentic-bot"];
      var target = pages.indexOf(app) >= 0
        ? "/apps/" + app + "/?support=open"
        : "/?support=open" + (/^[a-z0-9-]{1,64}$/.test(app) ? "&app=" + app : "");
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p><a href="/?support=open">Open questions and feedback</a></p>
</body>
</html>
